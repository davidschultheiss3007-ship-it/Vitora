<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vitora - Business English Presentation</title>
  <meta
    name="description"
    content="Vitora corporate communication presentation rebuilt as an interactive web deck."
  />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sections.css" />

  <script src="data/slides.js" defer></script>
  <script src="js/presentation.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/interactions.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="background-grid"></div>

  <header class="site-header" id="siteHeader">
    <a class="brand" href="#slide-01" aria-label="Vitora home">
      <span class="brand-mark">V</span>
      <span class="brand-copy">
        <strong>VITORA</strong>
        <small>Business English</small>
      </span>
    </a>

    <nav class="main-nav" id="mainNav" aria-label="Presentation navigation"></nav>

    <div class="header-actions">
      <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle theme">&#9790;</button>
      <button class="nav-cta" id="fullscreenToggle" type="button">Present</button>
    </div>
  </header>

  <main class="slide-deck" id="slideDeck" aria-label="Vitora presentation">
    <noscript>
      <section class="section">
        <div class="section-inner">
          <h1>Vitora</h1>
          <p>This interactive presentation requires JavaScript.</p>
        </div>
      </section>
    </noscript>
  </main>

  <aside class="presentation-controls" aria-label="Presentation controls">
    <button id="prevSection" type="button" aria-label="Previous slide">&#8592;</button>
    <div>
      <strong id="sectionCounter">1</strong>
      <span id="sectionTotal">12</span>
    </div>
    <button id="nextSection" type="button" aria-label="Next slide">&#8594;</button>
  </aside>
</body>
</html>
